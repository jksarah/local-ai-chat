<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>LocalLLM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #212121;
      color: #ececec;
      display: flex;
      overflow: hidden;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #444444;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #555555;
    }

    .sidebar {
      width: 270px;
      min-width: 270px;
      height: 100vh;

      background: #171717;
      border-right: 1px solid #2d2d2d;

      padding: 18px 14px;

      display: flex;
      flex-direction: column;

      overflow-y: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 8px 12px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #2f2f2f;
      border: 1px solid #3a3a3a;

      border-radius: 10px;
      font-size: 18px;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 650;
      color: #f5f5f5;
    }

    .brand-subtitle {
      margin-top: 2px;
      font-size: 11px;
      color: #777777;
    }

    .new-chat {
      width: 100%;

      display: flex;
      align-items: center;
      gap: 9px;

      margin-top: 10px;
      padding: 11px 13px;

      background: transparent;
      color: #e5e5e5;

      border: 1px solid #343434;
      border-radius: 10px;

      cursor: pointer;

      font-size: 14px;
      font-weight: 500;

      text-align: left;

      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .new-chat:hover {
      background: #252525;
      border-color: #404040;
    }

    .status {
      margin-top: 16px;
      padding: 10px 12px;

      display: flex;
      align-items: center;
      gap: 8px;

      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.14);

      border-radius: 10px;
      color: #85e0b5;

      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      background: #10b981;
      border-radius: 50%;

      box-shadow: 0 0 7px rgba(16, 185, 129, 0.6);
    }

    .chat-history-title {
      margin-top: 28px;
      margin-bottom: 8px;
      padding: 0 8px;

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 0.7px;
      text-transform: uppercase;

      color: #6f6f6f;
    }

    #chatHistory {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 8px;

      width: 100%;

      padding: 9px 10px;

      border-radius: 8px;

      color: #bdbdbd;
      cursor: pointer;

      font-size: 13px;

      transition:
        background 0.15s ease,
        color 0.15s ease;
    }

    .chat-item:hover {
      background: #242424;
      color: #ededed;
    }

    .chat-item.active {
      background: #2a2a2a;
      color: #ffffff;
    }

    .chat-title {
      flex: 1;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .delete-chat {
      width: 27px;
      height: 27px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;

      background: transparent;
      color: #777777;

      border: none;
      border-radius: 6px;

      cursor: pointer;
      opacity: 0;

      transition:
        opacity 0.15s ease,
        background 0.15s ease,
        color 0.15s ease;
    }

    .chat-item:hover .delete-chat {
      opacity: 1;
    }

    .delete-chat:hover {
      background: #333333;
      color: #ef7373;
    }

    .main {
      flex: 1;
      min-width: 0;

      height: 100vh;

      display: flex;
      flex-direction: column;

      background: #212121;
    }

    .header {
      min-height: 68px;

      padding: 12px 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      background: rgba(33, 33, 33, 0.95);
      border-bottom: 1px solid #2b2b2b;
    }

    .header-left h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      color: #f2f2f2;
    }

    .header-left p {
      margin: 4px 0 0;
      font-size: 12px;
      color: #808080;
    }

    .model-box {
      display: flex;
      align-items: center;
      gap: 8px;

      padding: 6px 8px 6px 11px;

      background: #2b2b2b;
      border: 1px solid #3b3b3b;
      border-radius: 10px;
    }

    .model-box label {
      font-size: 12px;
      color: #929292;
    }

    .model-box select {
      min-width: 110px;

      padding: 4px 24px 4px 4px;

      background: transparent;
      color: #eeeeee;

      border: none;
      outline: none;

      font-size: 13px;
      font-weight: 500;

      cursor: pointer;
    }

    .model-box option {
      background: #2b2b2b;
      color: white;
    }

    #chat {
      flex: 1;
      overflow-y: auto;

      padding:
        28px
        clamp(20px, 5vw, 70px)
        40px;

      display: flex;
      flex-direction: column;
      align-items: center;

      scroll-behavior: smooth;
    }

    .msg {
      width: 100%;
      max-width: 820px;

      overflow-wrap: break-word;

      animation: fadeIn 0.2s ease;
    }

    /* =========================
       USER MESSAGE ROW
    ========================== */

    .user {
      width: 100%;
      max-width: 820px;

      display: flex;
      justify-content: flex-end;

      margin-top: 24px;
      margin-bottom: 34px;

      padding: 0;

      background: transparent;
      border: none;
      box-shadow: none;
    }

    .user-bubble {
      width: fit-content;
      max-width: 70%;

      padding: 10px 16px;

      background: #303030;
      color: #f2f2f2;

      border: 1px solid #3b3b3b;

      border-radius: 18px 18px 6px 18px;

      font-size: 15px;
      line-height: 1.5;

      white-space: pre-wrap;
      overflow-wrap: break-word;

      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.14),
        0 3px 10px rgba(0, 0, 0, 0.07);
    }

    /* =========================
       AI MESSAGE
    ========================== */

    .ai {
      width: 100%;
      max-width: 760px;

      margin-bottom: 44px;

      color: #e8e8e8;
    }

    .sender {
      display: flex;
      align-items: center;
      gap: 7px;

      margin-bottom: 10px;

      color: #969696;

      font-size: 12px;
      font-weight: 600;

      letter-spacing: 0.2px;
    }

    .ai-content {
      color: #e8e8e8;

      font-size: 16px;
      line-height: 1.8;

      max-width: 760px;
    }

    .ai-content > *:first-child {
      margin-top: 0;
    }

    .ai-content > *:last-child {
      margin-bottom: 0;
    }

    .ai-content p {
      margin: 0 0 18px 0;
    }

    .ai-content h1,
    .ai-content h2,
    .ai-content h3 {
      margin: 28px 0 14px;

      color: #f5f5f5;

      line-height: 1.35;
      font-weight: 650;
    }

    .ai-content h1 {
      font-size: 25px;
    }

    .ai-content h2 {
      font-size: 21px;
    }

    .ai-content h3 {
      font-size: 18px;
    }

    .ai-content ul,
    .ai-content ol {
      margin: 14px 0 20px;
      padding-left: 26px;
    }

    .ai-content li {
      margin: 8px 0;
    }

    .ai-content strong {
      color: #ffffff;
      font-weight: 650;
    }

    .ai-content em {
      color: #cccccc;
    }

    .ai-content code {
      padding: 2px 6px;

      background: #2c2c2c;
      color: #f1f1f1;

      border: 1px solid #383838;
      border-radius: 5px;

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: 13.5px;
    }

    .ai-content pre {
      margin: 16px 0;
      padding: 15px 16px;

      background: #151515;

      border: 1px solid #303030;
      border-radius: 10px;

      overflow-x: auto;
    }

    .ai-content pre code {
      padding: 0;
      background: transparent;
      border: none;

      color: #e9e9e9;
      line-height: 1.6;
    }

    .ai-content table {
      width: 100%;

      margin: 16px 0;

      border-collapse: collapse;

      overflow: hidden;

      border-radius: 8px;

      font-size: 14px;
    }

    .ai-content th,
    .ai-content td {
      padding: 10px 12px;

      border: 1px solid #3a3a3a;

      text-align: left;
    }

    .ai-content th {
      background: #2a2a2a;
      color: #ffffff;
    }

    .ai-content blockquote {
      margin: 16px 0;

      padding: 3px 0 3px 14px;

      border-left: 3px solid #616161;

      color: #bdbdbd;
    }

    .ai-content a {
      color: #8ab4f8;
      text-decoration: none;
    }

    .ai-content a:hover {
      text-decoration: underline;
    }

    .typing {
      display: inline-flex;
      align-items: center;

      color: #969696;

      font-size: 13px;
      font-style: normal;
    }

    .typing::after {
      content: "";

      width: 5px;
      height: 5px;

      margin-left: 8px;

      background: #969696;

      border-radius: 50%;

      animation: pulse 1s infinite;
    }

    .input-wrapper {
      width: 100%;

      padding: 0 24px 18px;
    }

    #inputArea {
      width: 100%;
      max-width: 820px;

      margin: 0 auto;

      padding: 8px 8px 8px 17px;

      display: flex;
      align-items: center;
      gap: 8px;

      background: #2f2f2f;

      border: 1px solid #414141;

      border-radius: 18px;

      box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.25);

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    #inputArea:focus-within {
      border-color: #535353;

      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3);
    }

    #msg {
      flex: 1;
      min-width: 0;

      padding: 10px 2px;

      background: transparent;
      color: #f1f1f1;

      border: none;
      outline: none;

      font-size: 15px;
    }

    #msg::placeholder {
      color: #858585;
    }

    .send-button {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;

      background: #f2f2f2;
      color: #171717;

      border: none;
      border-radius: 12px;

      cursor: pointer;

      font-size: 18px;
      font-weight: bold;

      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .send-button:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    .footer-note {
      margin-top: 8px;

      text-align: center;

      color: #666666;

      font-size: 10px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.3;
      }

      50% {
        opacity: 1;
      }
    }

    @media (max-width: 900px) {
      .user-bubble {
        max-width: 78%;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .header {
        min-height: 60px;
        padding: 10px 14px;
      }

      .header-left p {
        display: none;
      }

      .model-box label {
        display: none;
      }

      .model-box select {
        min-width: 95px;
      }

      #chat {
        padding:
          22px
          14px
          30px;
      }

      .user-bubble {
        max-width: 88%;
      }

      .input-wrapper {
        padding:
          0
          10px
          10px;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">

    <div class="brand">
      <div class="brand-icon">🧠</div>

      <div class="brand-text">
        <span class="brand-title">LocalLLM</span>
        <span class="brand-subtitle">Private AI workspace</span>
      </div>
    </div>

    <button
      class="new-chat"
      onclick="newChat()"
    >
      <span>＋</span>
      <span>New chat</span>
    </button>

    <div
      class="status"
      id="modelStatus"
    >
      <span class="status-dot"></span>

      <span id="modelStatusText">
        Local Llama 3 Active
      </span>
    </div>

    <div class="chat-history-title">
      Previous chats
    </div>

    <div id="chatHistory"></div>

  </aside>

  <main class="main">

    <header class="header">

      <div class="header-left">
        <h1>Local AI Assistant</h1>
        <p>Private chatbot powered by local language models</p>
      </div>

      <div class="model-box">

        <label for="modelSelect">
          Model
        </label>

        <select id="modelSelect">

          <option value="llama3">
            Llama 3
          </option>

          <option value="mistral">
            Mistral
          </option>

          <option value="qwen2.5:7b">
            Qwen 2.5
          </option>

        </select>

      </div>

    </header>

    <div id="chat"></div>

    <div class="input-wrapper">

      <div id="inputArea">

        <input
          id="msg"
          type="text"
          autocomplete="off"
          placeholder="Message your local AI..."
          onkeydown="handleEnter(event)"
        >

        <button
          class="send-button"
          onclick="send()"
          title="Send"
        >
          ↑
        </button>

      </div>

      <div class="footer-note">
        Local models can make mistakes. Verify important information.
      </div>

    </div>

  </main>

<script>

let chats =
  JSON.parse(
    localStorage.getItem("llamaChats")
  ) || [];

let currentChatId = null;

let messages = [];

marked.setOptions({
  breaks: true,
  gfm: true
});

function escapeHTML(text) {
  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

function renderMarkdown(text) {
  return marked.parse(
    text || ""
  );
}

window.onload = function () {

  if (chats.length === 0) {
    newChat();
  } else {
    currentChatId =
      chats[0].id;

    messages =
      chats[0].messages;

    loadChat(
      currentChatId
    );
  }

  renderChatHistory();
};

const modelSelect =
  document.getElementById(
    "modelSelect"
  );

const modelStatusText =
  document.getElementById(
    "modelStatusText"
  );

function getModelDisplayName(
  model
) {

  if (model === "llama3") {
    return "Llama 3";
  }

  if (model === "mistral") {
    return "Mistral";
  }

  if (model === "qwen2.5:7b") {
    return "Qwen 2.5";
  }

  return model;
}

modelSelect.addEventListener(
  "change",
  () => {

    const selectedModel =
      modelSelect.value;

    const modelName =
      getModelDisplayName(
        selectedModel
      );

    modelStatusText.textContent =
      `Local ${modelName} Active`;
  }
);

async function send() {

  const input =
    document.getElementById(
      "msg"
    );

  const text =
    input.value.trim();

  if (!text) {
    return;
  }

  input.value = "";

  messages.push({
    role: "user",
    content: text
  });

  addMessage(
    "You",
    text,
    "user"
  );

  updateCurrentChatTitle(
    text
  );

  saveCurrentChat();

  const selectedModel =
    document.getElementById(
      "modelSelect"
    ).value;

  const modelName =
    getModelDisplayName(
      selectedModel
    );

  const aiDiv =
    document.createElement(
      "div"
    );

  aiDiv.className =
    "msg ai";

  aiDiv.innerHTML = `
    <span class="sender">
      AI · ${modelName}
    </span>

    <div class="ai-content">
      <span class="typing">
        Thinking
      </span>
    </div>
  `;

  document
    .getElementById("chat")
    .appendChild(aiDiv);

  aiDiv.scrollIntoView({
    behavior: "smooth",
    block: "end"
  });

  try {

    const res =
      await fetch(
        "http://127.0.0.1:5000/api/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              messages:
                messages,

              model:
                selectedModel
            })
        }
      );

    if (!res.ok) {
      throw new Error(
        `Server returned ${res.status}`
      );
    }

    if (!res.body) {
      throw new Error(
        "Streaming response unavailable"
      );
    }

    const reader =
      res.body.getReader();

    const decoder =
      new TextDecoder();

    let fullReply = "";

    let firstChunk = true;

    while (true) {

      const {
        value,
        done
      } =
        await reader.read();

      if (done) {
        break;
      }

      const chunk =
        decoder.decode(
          value,
          {
            stream: true
          }
        );

      fullReply += chunk;

      if (firstChunk) {

        aiDiv.innerHTML = `
          <span class="sender">
            AI · ${modelName}
          </span>

          <div class="ai-content"></div>
        `;

        firstChunk = false;
      }

      const contentDiv =
        aiDiv.querySelector(
          ".ai-content"
        );

      if (contentDiv) {
        contentDiv.innerHTML =
          renderMarkdown(
            fullReply
          );
      }

      aiDiv.scrollIntoView({
        behavior: "smooth",
        block: "end"
      });
    }

    messages.push({
      role: "assistant",
      content: fullReply
    });

    saveCurrentChat();

  } catch (error) {

    console.error(
      "Chat request failed:",
      error
    );

    aiDiv.innerHTML = `
      <span class="sender">
        AI
      </span>

      <div class="ai-content">
        Unable to connect to the local AI server.
      </div>
    `;
  }
}

function addMessage(
  sender,
  text,
  type
) {

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "msg " + type;

  if (type === "ai") {

    div.innerHTML = `
      <span class="sender">
        ${escapeHTML(sender)}
      </span>

      <div class="ai-content">
        ${renderMarkdown(text)}
      </div>
    `;

  } else {

    div.innerHTML = `
      <div class="user-bubble">
        ${escapeHTML(text)}
      </div>
    `;
  }

  document
    .getElementById(
      "chat"
    )
    .appendChild(
      div
    );

  div.scrollIntoView({
    behavior: "smooth",
    block: "end"
  });
}

function handleEnter(
  event
) {

  if (
    event.key === "Enter"
  ) {

    event.preventDefault();

    send();
  }
}

function newChat() {

  const newChatObj = {
    id:
      Date.now(),

    title:
      "New Chat",

    messages:
      []
  };

  chats.unshift(
    newChatObj
  );

  currentChatId =
    newChatObj.id;

  messages = [];

  document
    .getElementById(
      "chat"
    )
    .innerHTML = `
      <div class="msg ai">

        <span class="sender">
          LocalLLM
        </span>

        <div class="ai-content">
          How can I help you today?
        </div>

      </div>
    `;

  saveChats();

  renderChatHistory();

  document
    .getElementById(
      "msg"
    )
    .focus();
}

function loadChat(
  chatId
) {

  currentChatId =
    chatId;

  const selectedChat =
    chats.find(
      chat =>
        chat.id === chatId
    );

  if (!selectedChat) {
    return;
  }

  messages =
    selectedChat.messages;

  const chatBox =
    document.getElementById(
      "chat"
    );

  chatBox.innerHTML = "";

  if (
    messages.length === 0
  ) {

    chatBox.innerHTML = `
      <div class="msg ai">

        <span class="sender">
          LocalLLM
        </span>

        <div class="ai-content">
          How can I help you today?
        </div>

      </div>
    `;

  } else {

    messages.forEach(
      message => {

        if (
          message.role ===
          "user"
        ) {

          addMessage(
            "You",
            message.content,
            "user"
          );

        } else {

          addMessage(
            "AI",
            message.content,
            "ai"
          );
        }
      }
    );
  }

  renderChatHistory();
}

function deleteChat(
  chatId,
  event
) {

  event.stopPropagation();

  chats =
    chats.filter(
      chat =>
        chat.id !== chatId
    );

  if (
    chats.length === 0
  ) {

    saveChats();

    newChat();

    return;
  }

  if (
    currentChatId ===
    chatId
  ) {

    currentChatId =
      chats[0].id;

    messages =
      chats[0].messages;

    loadChat(
      currentChatId
    );
  }

  saveChats();

  renderChatHistory();
}

function renderChatHistory() {

  const chatHistory =
    document.getElementById(
      "chatHistory"
    );

  chatHistory.innerHTML = "";

  chats.forEach(
    chat => {

      const chatItem =
        document.createElement(
          "div"
        );

      chatItem.className =
        "chat-item";

      if (
        chat.id ===
        currentChatId
      ) {

        chatItem
          .classList
          .add(
            "active"
          );
      }

      chatItem.onclick =
        function () {

          loadChat(
            chat.id
          );
        };

      chatItem.innerHTML = `
        <span class="chat-title">
          ${escapeHTML(
            chat.title
          )}
        </span>

        <button
          class="delete-chat"
          onclick="
            deleteChat(
              ${chat.id},
              event
            )
          "
          title="Delete chat"
        >
          ×
        </button>
      `;

      chatHistory
        .appendChild(
          chatItem
        );
    }
  );
}

function updateCurrentChatTitle(
  firstMessage
) {

  const selectedChat =
    chats.find(
      chat =>
        chat.id ===
        currentChatId
    );

  if (
    selectedChat &&
    selectedChat.title ===
      "New Chat"
  ) {

    selectedChat.title =
      firstMessage
        .substring(
          0,
          30
        )
        .trim();

    renderChatHistory();
  }
}

function saveCurrentChat() {

  const selectedChat =
    chats.find(
      chat =>
        chat.id ===
        currentChatId
    );

  if (selectedChat) {
    selectedChat.messages =
      messages;
  }

  saveChats();
}

function saveChats() {

  localStorage.setItem(
    "llamaChats",
    JSON.stringify(
      chats
    )
  );
}

</script>

</body>
</html>
